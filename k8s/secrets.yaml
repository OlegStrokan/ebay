---
apiVersion: v1
kind: Secret
metadata:
  name: ops-console-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  # Gates every human/frontend request into the OpsConsole backend (X-Admin-Api-Key
  # header) — must match ops-console-web-secret's OPS_CONSOLE_ADMIN_API_KEY below.
  AdminApiKey: change-me-ops-console-admin-key
  # Sent as x-internal-api-key on every outbound gRPC call to Order/Payment/Inventory's
  # admin services — must match the InternalServices__OpsConsoleApiKey value on
  # order-service-secret, payment-service-secret, and inventory-service-secret above.
  InternalServices__OpsConsoleApiKey: change-me-ops-console-shared-key-min-32-chars
  # Same signing key Auth issues operator JWTs with (see auth-service-secret) — OpsConsole
  # validates them locally rather than calling back into Auth for every request.
  Jwt__SecretKey: change-me-auth-secret-minimum-32-characters
  Jwt__Audience: ApiGateway
---
apiVersion: v1
kind: Secret
metadata:
  name: ops-console-web-secret
  namespace: free-ebay
type: Opaque
stringData:
  # Sent as X-Admin-Api-Key to the OpsConsole backend — must match
  # ops-console-service-secret's AdminApiKey above.
  OPS_CONSOLE_ADMIN_API_KEY: change-me-ops-console-admin-key
