apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: Host=postgres-write;Port=5432;Database=order;Username=order;Password=order_write_pass
  ConnectionStrings__PostgresReadModel: Host=postgres-read;Port=5432;Database=order_read;Username=order_read;Password=order_read_pass
  ConnectionStrings__Redis: redis:6379
  Shipping__ApiKey: replace-me-for-real-shipping-provider
  # Must match ops-console-service-secret's InternalServices__OpsConsoleApiKey below —
  # AdminOpsGrpcService rejects every call with PermissionDenied if these diverge.
  InternalServices__OpsConsoleApiKey: change-me-ops-console-shared-key-min-32-chars
---
